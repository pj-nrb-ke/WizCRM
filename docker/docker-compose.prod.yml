# Production Postgres — localhost only (not exposed to the internet).
services:
  postgres:
    image: postgres:16-alpine
    container_name: wizcrm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: wizcrm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: wizcrm
    volumes:
      - wizcrm_pg_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wizcrm -d wizcrm"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  wizcrm_pg_data:
