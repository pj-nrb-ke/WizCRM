services:
  postgres:
    image: postgres:16-alpine
    container_name: wizcrm-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: wizcrm
      POSTGRES_PASSWORD: wizcrm_dev
      POSTGRES_DB: wizcrm
    volumes:
      - wizcrm_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wizcrm -d wizcrm"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  wizcrm_pg_data:
